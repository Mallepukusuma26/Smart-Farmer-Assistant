{% extends "base.html" %}

{% block title %}Register Account — Smart Farmer Assistant{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">
            <div class="card border-0 shadow-lg rounded-4 p-4 p-md-5">
                <div class="text-center mb-4">
                    <div class="icon-box bg-success-subtle text-success rounded-circle p-3 d-inline-block mb-3">
                        <i class="fa-solid fa-user-plus fs-2"></i>
                    </div>
                    <h3 class="fw-bold">Create an Account</h3>
                    <p class="text-muted">Join Smart Farmer Assistant AI Platform</p>
                </div>

                <form method="POST" action="{{ url_for('auth.register') }}">
                    <div class="row g-3 mb-3">
                        <div class="col-md-6">
                            <label for="username" class="form-label fw-semibold">Username *</label>
                            <input type="text" class="form-control" id="username" name="username" required>
                        </div>
                        <div class="col-md-6">
                            <label for="email" class="form-label fw-semibold">Email Address *</label>
                            <input type="email" class="form-control" id="email" name="email" required>
                        </div>
                    </div>

                    <div class="row g-3 mb-3">
                        <div class="col-md-6">
                            <label for="password" class="form-label fw-semibold">Password *</label>
                            <input type="password" class="form-control" id="password" name="password" required>
                        </div>
                        <div class="col-md-6">
                            <label for="confirm_password" class="form-label fw-semibold">Confirm Password *</label>
                            <input type="password" class="form-control" id="confirm_password" name="confirm_password" required>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="role" class="form-label fw-semibold">Account Role *</label>
                        <select class="form-select" id="role" name="role" required>
                            <option value="FARMER" selected>Farmer</option>
                            <option value="ADVISOR">Agricultural Advisor</option>
                            <option value="ADMIN">System Administrator</option>
                        </select>
                    </div>

                    <div class="row g-3 mb-3">
                        <div class="col-md-6">
                            <label for="full_name" class="form-label fw-semibold">Full Name</label>
                            <input type="text" class="form-control" id="full_name" name="full_name">
                        </div>
                        <div class="col-md-6">
                            <label for="phone" class="form-label fw-semibold">Phone Number</label>
                            <input type="text" class="form-control" id="phone" name="phone">
                        </div>
                    </div>

                    <div class="mb-4">
                        <label for="region" class="form-label fw-semibold">Agricultural Region / Location</label>
                        <input type="text" class="form-control" id="region" name="region" placeholder="e.g. Central Valley Zone">
                    </div>

                    <button type="submit" class="btn btn-emerald w-100 py-3 fw-bold rounded-pill mb-3">
                        Create Account <i class="fa-solid fa-user-check ms-1"></i>
                    </button>
                </form>

                <div class="text-center">
                    <p class="text-muted mb-0">Already registered? <a href="{{ url_for('auth.login') }}" class="text-success fw-bold text-decoration-none">Sign in here</a></p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
