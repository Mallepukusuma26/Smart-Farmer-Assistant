{% extends "base.html" %}
{% block title %}403 Access Forbidden — Smart Farmer Assistant{% endblock %}
{% block content %}

        <i class="fa-solid fa-lock fs-1 text-danger mb-3"></i>
        <h1 class="display-4 fw-extrabold text-dark mb-2">403</h1>
        <h3 class="fw-bold mb-3">Access Denied</h3>

        <a href="{{ url_for('index') }}" class="btn btn-emerald rounded-pill px-4 py-2 fw-bold">Return Home</a>
    </div>
</div>
{% endblock %}
